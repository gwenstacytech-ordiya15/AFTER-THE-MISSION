Hands-On Classroom Activity
Build Your Own 3D Shoebox Space Museum
Teachers & students: recreate our exact 4-zone physical model in 60 minutes using a recycled shoebox, bubble wrap, and metallic paper!
Prep · Things Needed
Gather Recycled Supplies
Grab a shoebox, bubble wrap, a foam cube, metallic gold/silver/black paper, markers, tape, and scissors.

Step 1 · 15 Mins
Box & Bubble Skylight
Line the inside walls with black paper, dot neon stars, and tape clear bubble wrap over a cutout window on the roof.

Step 2 · 20 Mins
Shape 3D Worlds
Create gray bubble-wrap Moon craters (left), orange Mars terrain (right), and a gold-wrapped foam Saturn (top-left).

Step 3 · 20 Mins
Probes, Paths & Labels
Fold miniature Apollo 11, Opportunity, Cassini, and Voyager 1 probes from foil paper, suspend them, and glue bold zone labels.

Final Result · Lights On!
Illuminated Space Museum
Turn off the room lights and shine light through the top skylight to bring all 4 NASA zones to life!


💡 Lighting Option A: Quick Classroom Mode
Place a phone flashlight or small desk lamp face-down over the bubble-wrap skylight for instant, bright studio-style illumination.


⚡ Lighting Option B: STEM Circuit Upgrade
Wire a 2.5V battery box, switch, and mini bulb holder over the skylight to combine space exploration with hands-on electrical engineering!

let scannedSet = new Set();
let quizCompleted = false;
let currentQ = 0;
let score = 0;
let currentFilter = 'all';
function updateXP() {
const xp = (scannedSet.size * 25) + (quizCompleted ? 100 : 0);
const pct = Math.min(100, Math.round((xp / 250) * 100));
document.getElementById('xpFill').style.width = pct + '%';
document.getElementById('xpText').textContent = ${xp} / 250 XP;
let rank = 'Cadet';
if (xp >= 250) rank = 'Master Archivist 🏆';
else if (xp >= 150) rank = 'Mission Specialist';
else if (xp >= 50) rank = 'Junior Explorer';
document.getElementById('rankLabel').textContent = rank;
}
function renderCards(filter = currentFilter) {
const grid = document.getElementById('cardsGrid');
grid.innerHTML = '';
missions
.filter(m => filter === 'all' || m.zone === filter)
.forEach(m => {
const isScanned = scannedSet.has(m.id);
const card = document.createElement('div');
card.className = card ${isScanned ? 'scanned' : ''};
card.innerHTML = <div> <span class="scanned-badge">✓ +25 XP</span> <span class="status-tag">${m.status}</span> <h3>${m.title}</h3> <p>${m.subtitle}</p> </div> <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="openMission('${m.id}')"> 🔍 Inspect Mission Dossier </button>;
grid.appendChild(card);
});
}
function filterCards(zone, btn) {
currentFilter = zone;
document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
renderCards(zone);
}
function openMission(id) {
const m = missions.find(item => item.id === id);
if (!m) return;
scannedSet.add(id);
updateXP();
renderCards(currentFilter);
document.getElementById('mStatus').textContent = m.status;
document.getElementById('mTitle').textContent = m.title;
document.getElementById('mSubtitle').textContent = m.subtitle;
document.getElementById('mLocation').textContent = m.location;
document.getElementById('mDuration').textContent = m.duration;
document.getElementById('mEnd').textContent = m.end;
document.getElementById('mMetric').textContent = m.metric;
document.getElementById('mAchieved').textContent = m.achieved;
document.getElementById('mWhy').textContent = m.why;
document.getElementById('missionModal').classList.add('open');
}
function closeModal() {
document.getElementById('missionModal').classList.remove('open');
}
function renderQuiz() {
const box = document.getElementById('quizContainer');
if (currentQ >= quizQuestions.length) {
